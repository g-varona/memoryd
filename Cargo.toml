[package]
name = "memoryd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Small, local, shared memory server for Claude Code (MCP over localhost HTTP)"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
candle-core = { version = "0.11", features = ["accelerate"] }
candle-nn = { version = "0.11", features = ["accelerate"] }
candle-transformers = { version = "0.11", features = ["accelerate"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rmcp = { version = "3.9", default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
